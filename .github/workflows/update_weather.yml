name: Update Weather Forecast

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update-weather:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Delete DB if Size Exceeds 88 MB
        run: |
          DB_FILE="data/weather_history.db"
          MAX_SIZE=$((88 * 1024 * 1024))
          if [ -f "$DB_FILE" ]; then
            FILE_SIZE=$(stat -c%s "$DB_FILE")
            if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
              echo "weather_history.db is $(( FILE_SIZE / 1024 / 1024 )) MB — exceeds 88 MB limit, deleting."
              rm "$DB_FILE"
            else
              echo "weather_history.db is $(( FILE_SIZE / 1024 / 1024 )) MB — within limit, keeping."
            fi
          else
            echo "weather_history.db does not exist — nothing to delete."
          fi

      - name: Run Weather Update Script
        run: |
          python -m backend.forecast_api

      - name: Commit and Push Updated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto update weather forecast"

          git pull --rebase origin main
          git push origin main
